<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>국제교류 실무 영상 강의실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 상단 바 + 왼쪽 챕터 목록(인강식 인덱스) + 오른쪽 영상·학습 패널 */
:root{
  --bg:#f3f5f9; --panel:#ffffff; --ink:#18213a; --sub:#5b6680; --mute:#8b95ab; --line:#dfe4ee;
  --navy:#17305e; --navy-ink:#ffffff; --teal:#14897b; --teal-soft:#e3f4f1; --acc:#d9772b; --acc-soft:#fdf0e5;
  --law:#17305e; --gov:#14897b; --case:#d9772b; --hl:#fff4d6;
  --f:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --panel:#172036; --ink:#e7ecf6; --sub:#a7b2c9; --mute:#7c88a2; --line:#2a3553;
  --navy:#2d4f8c; --navy-ink:#ffffff; --teal:#3fc0ad; --teal-soft:#16363a; --acc:#f0995a; --acc-soft:#3a2a1d;
  --law:#6f95da; --gov:#3fc0ad; --case:#f0995a; --hl:#3a3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1524; --panel:#172036; --ink:#e7ecf6; --sub:#a7b2c9; --mute:#7c88a2; --line:#2a3553;
  --navy:#2d4f8c; --navy-ink:#ffffff; --teal:#3fc0ad; --teal-soft:#16363a; --acc:#f0995a; --acc-soft:#3a2a1d;
  --law:#6f95da; --gov:#3fc0ad; --case:#f0995a; --hl:#3a3420; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--navy);color:var(--navy-ink);
  display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-size:17px;font-weight:900;letter-spacing:-.01em}
.brand span{font-size:12px;opacity:.75}
.overall{display:flex;align-items:center;gap:10px;font-size:13px;margin-left:auto}
.overall .track{width:140px;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.overall .track i{display:block;height:100%;background:#7fd8c9;width:0}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;border:0;border-radius:8px;padding:8px 12px;background:rgba(255,255,255,.14);color:var(--navy-ink)}
.search input::placeholder{color:rgba(255,255,255,.7)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.2);max-height:60vh;overflow:auto;z-index:20}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--teal-soft)}
.results small{display:block;color:var(--teal);font-weight:700;font-size:12px}
.results .none{padding:12px 14px;color:var(--sub)}
mark{background:var(--hl);color:inherit;padding:0 1px}

.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.side h2{margin:0;font-size:13px;letter-spacing:.08em;color:var(--mute);padding:14px 16px 8px;font-weight:700}
.chs{overflow:auto;padding:0 8px 10px}
.ch{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;background:none;border-radius:10px;padding:9px 8px}
.ch:hover{background:var(--bg)}
.ch .n{width:44px;height:44px;border-radius:10px;background:var(--bg);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;border:1px solid var(--line)}
.ch>span:nth-child(2){display:flex;flex-direction:column;min-width:0}
.ch .t{font-weight:700;font-size:14.5px;line-height:1.35}
.ch .m{font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.ch .p{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px}.ch .p i{display:block;height:100%;background:var(--teal);width:0}
.ch .done{color:var(--teal);font-weight:900;font-size:16px;visibility:hidden}
.ch.is-done .done{visibility:visible}
.ch[aria-current="true"]{background:var(--teal-soft)}
.ch[aria-current="true"] .n{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.sc{list-style:none;margin:2px 0 8px 52px;padding:0;border-left:2px solid var(--line)}
.sc button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:4px 8px;font-size:13px;color:var(--sub);border-radius:6px}
.sc button:hover{background:var(--bg)}
.sc button.on{color:var(--ink);font-weight:700;background:var(--hl)}
.sc time{font-variant-numeric:tabular-nums;color:var(--mute);flex:none;width:40px}

.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.player{background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-width:100%;position:relative}
.player video{width:100%;height:100%;display:block}
video::cue{font-family:var(--f);font-size:22px;background:rgba(23,48,94,.88);color:#fff;line-height:1.5}
.resume{position:absolute;left:16px;bottom:64px;background:var(--panel);color:var(--ink);border:0;border-radius:10px;padding:9px 14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.head .tt{flex:1 1 320px;min-width:0}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--teal)}
h1{margin:2px 0 0;font-size:26px;line-height:1.3;font-weight:900;color:var(--ink);text-wrap:balance}
h1 small{display:block;font-size:15px;font-weight:500;color:var(--sub);margin-top:4px}
.nav{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--sub)}
.tools label{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.tools select{border:0;background:none;font-weight:700}
.tools .keys{margin-left:auto;font-size:12px;color:var(--mute)}
kbd{font-family:var(--f);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.info div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.info b{display:block;font-size:12px;letter-spacing:.06em;color:var(--mute);margin-bottom:4px}
.why{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:12px 16px;color:var(--sub)}
.why b{color:var(--ink)}
.now{display:flex;gap:10px;flex-wrap:wrap;font-size:13.5px}
.now span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--sub);min-width:0}
.now span b{color:var(--ink);margin-right:6px}
.tabs{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tablist{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tablist button{border:0;background:none;padding:12px 18px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
.tablist button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.pane{padding:14px 18px;max-height:440px;overflow:auto}
.cue{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.cue:hover{background:var(--bg)}
.cue time{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;padding-top:1px}
.cue.on{background:var(--hl)}
.sh{font-size:12px;font-weight:900;color:var(--teal);letter-spacing:.06em;margin:12px 8px 4px}
.chk{display:flex;flex-direction:column;gap:8px}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);flex:none}
.chk label:has(input:checked){background:var(--teal-soft);border-color:var(--teal)}
.chk label:has(input:checked) span{color:var(--sub);text-decoration:line-through}
.chk .sum{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.src{display:flex;flex-direction:column;gap:10px}
.src div{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.src b{display:block}.src small{color:var(--sub)}
.bd{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:6px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.bd.law{background:var(--law)}.bd.gov{background:var(--gov)}.bd.case{background:var(--case)}
.legend{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.notice{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:13.5px;color:var(--sub)}
.notice summary{cursor:pointer;font-weight:700;color:var(--ink)}
.notice p{margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:10px;font-weight:700;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .chs{max-height:320px}
  .info{grid-template-columns:minmax(0,1fr)}
  .tools .keys{display:none}
  .overall .track{width:80px}
  h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>


<header class="bar">
  <div class="brand"><b>국제교류수업 운영 매뉴얼</b><span>영상을 따라 배우는 국제교류 실무 가이드</span></div>
  <div class="search"><input id="q" type="search" placeholder="대본에서 찾기 (예: 낙찰차액, 표절률, MOU)" autocomplete="off" aria-label="대본 검색"><div class="results" id="res" hidden></div></div>
  <div class="overall" title="90% 이상 시청한 챕터"><span id="ovt">0 / 9 완료</span><span class="track"><i id="ovb"></i></span></div>
</header>

<div class="wrap">

    </div>
    <div class="now" id="now"></div>
    <div class="why" id="why"></div>
    <div class="info" id="info"></div>

      <div class="tablist" role="tablist">

      </div>
      <div class="pane" id="pane"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

현장체험학습 길라잡이 p.4~7 · 해외연수 안전 길라잡이 p.13·15"}, {"t": 127.6, "label": "규정 → 매뉴얼 63쪽", "page": "63쪽, 부록 115~121쪽", "act": "", "src": "공무국외출장 규정"}, {"t": 147.6, "label": "기재요령 → 매뉴얼 70쪽", "page": "70쪽", "act": "", "src": "학생부 기재요령"}, {"t": 167.2, "label": "영상에서 근거를 구분하는 방법", "page": "", "act": "", "src": "—"}, {"t": 188.95, "label": "공식 안내", "page": "", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 211.3, "label": "업무여정 지도(6~7쪽)", "page": "6~7쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 235.45, "label": "챕터 선택", "page": "", "act": "필요한 챕터 선택", "src": ""}], "cues": [[0.8, 8.0, "국제교류수업 운영 매뉴얼, 영상을 따라 배우는 국제교류 실무 가이드를 시작하겠습니다."], [10.05, 14.45, "국제교류 업무를 처음 맡으면 이런 질문부터 생깁니다."], [14.8, 17.2, "어디서부터 시작해야 할까요?"], [17.55, 19.95, "해외학교는 어떻게 찾을까요?"], [20.3, 26.5, "어떤 행정절차가 필요하고, 해외현장체험학습에는 어떤 서류가 필요할까요?"], [26.85, 32.05, "그리고 이 활동을 학교생활기록부에는 어떻게 기록해야 할까요?"], [34.1, 40.7, "국제교류는 학생들에게 세계와 소통하는 경험을 주는 의미 있는 교육활동입니다."], [41.05, 51.65, "하지만 담당 교사에게는 해외학교를 찾고, 시차와 학사일정을 조율하고, 학생 안전과 행정절차까지 챙겨야 하는 일이 적지 않습니다."], [52.0, 55.4, "여는 글도 바로 이 어려움에서 출발합니다."], [57.45, 66.65, "이 매뉴얼은 업무를 처음 맡은 선생님도 필요한 절차를 쉽게 이해하고 체계적으로 준비할 수 있도록 만들었습니다."], [67.0, 79.6, "기본 방향부터 해외학교 매칭, 연간 운영, 행정절차, 학생 성장 기록까지 운영 과정의 순서대로 담았고, 도내 학교의 실천 사례와 서식, 점검표를 함께 실었습니다."], [81.65, 85.65, "그렇다면 이 매뉴얼의 내용은 어디에서 왔을까요?"], [86.0, 89.8, "매뉴얼에는 출처가 표시된 자료들이 있습니다."], [90.15, 104.15, "현장체험학습 길라잡이와 학생 해외연수 안전 길라잡이, 공무국외출장 규정, 학교생활기록부 기재요령, 학교회계 예산편성 지침, 그리고 도내 학교들의 실제 운영 사례입니다."], [106.2, 121.8, "예를 들어 4장의 인솔교사 연수와 안전요원 배치 기준은 2026 현장체험학습 길라잡이의 4쪽부터 7쪽, 그리고 학생 해외연수 안전 길라잡이의 13쪽과 15쪽을 바탕으로 정리했습니다."], [122.15, 126.35, "매뉴얼 59쪽 아래에 출처가 그대로 적혀 있습니다."], [128.4, 138.6, "공무국외출장 절차는 전북특별자치도교육감 소속 공무원의 공무국외출장 규정, 교육훈령 제308호를 기준으로 했습니다."], [138.95, 146.35, "2026년 5월 1일 시행본이며, 부록 1-1부터 1-6의 서식은 이 규정의 별지 서식입니다."], [148.4, 160.0, "6장 학교생활기록부 기재 가이드는 2026학년도 학교생활기록부 기재요령, 고등학교용을 근거로 작성했다고 첫머리에 밝히고 있습니다."], [160.35, 165.95, "초등학교와 중학교는 해당 학교급 기재요령을 함께 확인해야 합니다."], [168.0, 172.2, "이때 중요한 것은 자료마다 힘이 다르다는 점입니다."], [172.55, 182.95, "법률과 훈령은 지켜야 하는 기준이고, 교육청 지침과 길라잡이는 업무 처리의 공식 안내이며, 학교 사례는 참고할 실천 경험입니다."], [183.3, 187.7, "영상에서는 이 셋을 색으로 구분해 보여 드리겠습니다."], [189.75, 193.35, "그래서 꼭 말씀드리고 싶은 안내가 있습니다."], [193.7, 200.9, "이 매뉴얼은 업무를 돕기 위한 참고자료이고, 매뉴얼 자체가 법적 근거가 되지는 않습니다."], [201.25, 210.05, "실제로 일을 처리할 때에는 관련 법령과 그해의 교육청 지침, 그리고 학교의 내부 절차를 꼭 함께 확인해 주세요."], [212.1, 219.9, "매뉴얼 6쪽과 7쪽의 업무여정 지도는 2월 계획부터 12월 정산까지 한 해의 길을 보여 줍니다."], [220.25, 227.85, "각 칸에는 그 시기에 할 일과 함께 대외공문, 내부결재, 심의, 사전·사후 제출 표시가 붙어 있습니다."], [228.2, 234.2, "영상을 보다가 지금 어느 단계인지 헷갈리면 이 지도로 돌아오시면 됩니다."], [236.25, 243.45, "이 영상은 처음부터 순서대로 보셔도 되고, 지금 필요한 업무의 챕터만 골라 보셔도 됩니다."], [243.8, 250.4, "각 챕터에는 실제 업무 순서와 매뉴얼 쪽수, 참고자료, 서식 활용법이 들어 있습니다."], [250.75, 255.15, "필요한 챕터를 선택해 업무를 함께 진행해 보겠습니다."]], "check": ["매뉴얼의 법적 성격(참고자료)과 근거자료 3구분을 이해했다", "업무여정 지도(6~7쪽)의 위치와 범례를 확인했다", "지금 맡은 업무에 해당하는 챕터를 골랐다"], "file": "videos/00.mp4", "vtt": "subs/00.vtt"}, {"id": "ch01", "key": "CH01", "no": "01", "title": "첫걸음", "sub": "국제교류 업무의 전체 구조 이해하기", "goal": "국제교류 업무를 처음 담당하는 교사가 전체 업무의 구조와 진행 순서를 이해한다.", "why": "업무를 시작하기 전에 국제교류수업의 목적과 운영 방식, 한 해의 진행 단계, 교육청 지원 체계를 먼저 알아야 이후 실무를 순서대로 진행할 수 있기 때문에 따로 구성했습니다.", "pages": "6~11쪽", "practice": "업무여정 지도에 올해 우리 학교 일정을 겹쳐 적어 보기", "dur": 186.7, "srcs": [{"t": "국제교류수업 운영 매뉴얼(본 매뉴얼)", "o": "전북특별자치도교육청", "d": "2026", "k": "매뉴얼 자체(실무 권장)", "c": "case", "n": "법적 구속력 없는 교사용 업무 참고서"}, {"t": "해당 연도 국제교류수업 공모·운영 계획(공문)", "o": "전북특별자치도교육청 정책기획과", "d": "매년", "k": "교육청 공문", "c": "gov", "n": "공모 일정, 최소 6차시(실시간 3·비실시간 3), 사전·사후 제출 서류 — 매년 원문 확인 필요"}], "scenes": [{"t": 0, "label": "이 장을 따로 구성한 이유", "page": "8쪽", "act": "", "src": ""}, {"t": 18.75, "label": "정의 및 비전", "page": "9쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 42.5, "label": "운영 개요 — 필수 1 + 선택 2", "page": "9쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 62.05, "label": "단계별 절차(3단계)", "page": "10쪽", "act": "", "src": "매뉴얼(실무 권장) · 해당 연도 공모·운영 계획"}, {"t": 83.2, "label": "운영비 지원 4유형", "page": "11쪽", "act": "", "src": "매뉴얼(실무 권장) · 해당 연도 공모·운영 계획(해당 연도 공모 계획)"}, {"t": 104.95, "label": "업무여정 12단계", "page": "6~7쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 128.5, "label": "업무를 배정받은 첫 주에 할 일", "page": "", "act": "4단계를 실제로 수행", "src": "해당 연도 공모·운영 계획 · 매뉴얼(실무 권장)"}, {"t": 156.75, "label": "1장 업무 완료 체크리스트", "page": "", "act": "체크리스트 확인", "src": ""}, {"t": 171.85, "label": "마무리 · 다음 단계", "page": "", "act": "", "src": ""}], "cues": [[0.8, 2.4, "1장 첫걸음입니다."], [2.75, 7.75, "국제교류 업무를 막 배정받은 상황이라고 생각해 보겠습니다."], [8.1, 17.5, "서류를 펼치기 전에 먼저 해야 할 일은, 이 업무가 무엇이고 한 해 동안 어떤 순서로 흘러가는지 큰 그림을 잡는 것입니다."], [19.55, 21.75, "매뉴얼 9쪽을 보겠습니다."], [22.1, 35.9, "국제교류수업 학교는 언어와 문화, 지속가능 목표를 주제로 한 교류 콘텐츠를 교육과정에 적용하고, 국내학교와 해외학교가 함께 비대면·대면 수업을 운영하는 학교입니다."], [36.25, 41.25, "목표는 외국어 실력이 아니라 세계시민으로서의 성장입니다."], [43.3, 45.5, "운영 방식은 세 가지입니다."], [45.85, 52.85, "온라인 공동수업은 필수이고, 해외현장체험학습과 해외학교 초청수업은 선택입니다."], [53.2, 60.8, "모든 교류는 온라인 공동수업에서 시작해 대면 교류로 넓혀 가는 구조라는 점을 기억해 두세요."], [62.85, 66.85, "10쪽에는 추진 현황과 단계별 절차가 있습니다."], [67.2, 78.0, "2월에서 3월은 네트워크 구축과 공모·선정, 3월부터 11월은 연수와 수업의 본격 운영, 7월부터 12월은 성과 관리와 나눔입니다."], [78.35, 81.95, "이 세 단계가 4장 연간 업무의 뼈대가 됩니다."], [84.0, 86.4, "11쪽은 운영비 지원입니다."], [86.75, 97.15, "온라인 공동수업, 해외 현장체험학습, 해외학교 초청수업, 그리고 이를 묶은 통합형까지 네 가지 유형에 따라 지원 내용이 다릅니다."], [97.5, 103.7, "우리 학교가 어떤 유형으로 신청할지에 따라 이후 준비할 서류도 달라집니다."], [105.75, 110.35, "이제 6쪽과 7쪽 업무여정 지도를 다시 펼쳐 보겠습니다."], [110.7, 122.9, "계획·공모, 위원회, 매칭 확정, 학생 선발, 업체 선정, 학교운영위원회 심의, 공무국외출장, 출국 준비, 현장체험, 결과보고, 정산까지 열두 칸의 길이 이어집니다."], [123.25, 127.25, "칸마다 붙은 표시가 그 시기의 공문과 결재입니다."], [129.3, 133.7, "업무를 배정받았다면 이 순서로 첫 주를 시작해 보세요."], [134.05, 139.65, "첫째, 올해 도교육청 공모 계획 공문을 찾아 일정과 유형을 확인합니다."], [140.0, 145.0, "둘째, 작년 담당자의 자료 폴더와 결과보고서를 인수받습니다."], [145.35, 149.75, "셋째, 업무여정 지도에 올해 학사일정을 겹쳐 적습니다."], [150.1, 155.5, "넷째, 관리자와 행정실에 운영 유형과 예산 규모를 먼저 공유합니다."], [157.55, 161.75, "1장을 마치기 전에 체크리스트로 확인하겠습니다."], [162.1, 169.1, "이 네 가지가 끝났다면 2장으로 넘어가 우리 학교에 맞는 운영형태를 고를 차례입니다."], [172.65, 179.05, "행정절차와 제출서류는 업무의 성격이나 지침 개정에 따라 달라질 수 있습니다."], [179.4, 185.4, "실제 추진 전에는 해당 연도 교육청 지침과 관련 법령을 다시 확인해 주세요."]], "check": ["올해 공모 계획 공문의 신청 기한과 유형을 확인했다", "작년 담당자 자료와 결과보고서를 확보했다", "업무여정 지도에 올해 일정을 적어 두었다", "관리자·행정실과 운영 유형·예산 규모를 공유했다"], "file": "videos/01.mp4", "vtt": "subs/01.vtt"}, {"id": "ch02", "key": "CH02", "no": "02", "title": "운영형태", "sub": "우리 학교에 맞는 교류 방식 고르고 준비하기", "goal": "우리 학교의 상황에 적합한 국제교류 운영방식을 선택하고 실제 수업을 준비할 수 있다.", "why": "국제교류수업은 한 가지 방식으로만 운영되지 않고, 운영형태에 따라 준비사항과 행정절차가 달라지기 때문에 별도 장으로 구성했습니다.", "pages": "12~25쪽", "practice": "온라인 공동수업 6차시 편성안 초안 작성, 초청 시 운영계획서(부록Ⅳ-1) 항목 확인", "dur": 257.4, "srcs": [{"t": "국제교류수업 운영 매뉴얼(본 매뉴얼)", "o": "전북특별자치도교육청", "d": "2026", "k": "매뉴얼 자체(실무 권장)", "c": "case", "n": "법적 구속력 없는 교사용 업무 참고서"}, {"t": "도내 학교 국제교류수업 운영 사례(사례 예시·매칭 수기)", "o": "도내 초·중·고 집필 교사", "d": "2024~2026", "k": "학교 사례", "c": "case", "n": "법적 기준이 아닌 실천 사례"}, {"t": "2026학년도 학교회계 예산편성 및 운영지침", "o": "전북특별자치도교육청", "d": "2026학년도", "k": "교육청 지침", "c": "gov", "n": "초청수업 경비 세목(교육운영비 B10-02, 일반업무추진비, 외빈초청여비, 강사수당)"}, {"t": "해당 연도 국제교류수업 공모·운영 계획(공문)", "o": "전북특별자치도교육청 정책기획과", "d": "매년", "k": "교육청 공문", "c": "gov", "n": "공모 일정, 최소 6차시(실시간 3·비실시간 3), 사전·사후 제출 서류 — 매년 원문 확인 필요"}], "scenes": [{"t": 0, "label": "이 장을 따로 구성한 이유", "page": "12쪽", "act": "", "src": ""}, {"t": 21.35, "label": "그림 2-1 사업 형태와 확장 구조", "page": "13쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 41.55, "label": "운영형태별 준비사항 한눈에", "page": "14~22쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 64.5, "label": "온라인 공동수업 준비 — 따라 하기", "page": "14~16쪽", "act": "상대 교사와 협의할 항목 메모", "src": "매뉴얼(실무 권장)"}, {"t": 89.4, "label": "최소 6차시(실시간 3 + 비실시간 3)", "page": "56쪽", "act": "", "src": "해당 연도 공모·운영 계획(해당 연도 운영 계획 — 원문 확인 필요)"}, {"t": 112.75, "label": "사례 — 실시간 수업 운영", "page": "15쪽", "act": "", "src": "학교 사례(학교 사례)"}, {"t": 139.3, "label": "현장체험학습 연계형 3단계", "page": "17쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 164.25, "label": "초청수업 업무 흐름 6단계", "page": "19~20쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 186.0, "label": "부록Ⅳ-1 운영계획서 연결", "page": "22쪽 → 부록 140쪽", "act": "부록Ⅳ-1 항목 확인", "src": "매뉴얼(실무 권장)"}, {"t": 206.0, "label": "예산편성 지침 → 23쪽", "page": "23쪽", "act": "", "src": "예산편성 운영지침"}, {"t": 228.35, "label": "2장 업무 완료 체크리스트", "page": "", "act": "체크리스트 확인", "src": ""}, {"t": 242.65, "label": "마무리 · 다음 단계", "page": "", "act": "", "src": ""}], "cues": [[0.8, 2.6, "2장 운영형태입니다."], [2.95, 12.75, "같은 국제교류라도 화면으로만 만나는지, 우리가 찾아가는지, 상대를 초청하는지에 따라 준비할 일과 결재가 달라집니다."], [13.1, 20.1, "이 장에서는 세 가지 형태를 비교하고 온라인 공동수업 준비를 직접 따라가 보겠습니다."], [22.15, 26.35, "13쪽 그림 2-1을 보시면 구조가 한눈에 보입니다."], [26.7, 40.3, "온라인 공동수업이 모든 교류의 출발점이고, 해외현장체험학습 연계형과 해외초청형 체험학습 연계형은 온라인에서 쌓은 관계와 주제를 대면으로 넓히는 형태입니다."], [42.35, 44.75, "세 형태를 비교해 보겠습니다."], [45.1, 56.7, "실시간 수업은 즉각적인 교감이 장점이지만 시차와 네트워크를 고려해야 하고, 비실시간 수업은 시차에 자유롭지만 꾸준한 관리가 필요합니다."], [57.05, 63.25, "현장체험과 초청은 교육 효과가 크지만 안전과 예산, 심의 절차가 더해집니다."], [65.3, 69.5, "이제 실제로 온라인 공동수업을 준비해 보겠습니다."], [69.85, 74.25, "먼저 상대 교사와 대주제와 최종 산출물을 합의합니다."], [74.6, 80.8, "다음으로 양국 시차를 계산해 실시간 수업 시간을 정하고, 플랫폼을 고릅니다."], [81.15, 88.15, "그리고 학생별로 발표할 부분을 나눈 뒤, 수업 하루 전 양교가 함께 연결 테스트를 합니다."], [90.2, 96.2, "차시는 최소 6차시, 그중 실시간 3차시와 비실시간 3차시를 편성합니다."], [96.55, 104.95, "이 기준은 매뉴얼 56쪽에 지침상 기준으로 나오며, 해당 연도 공모·운영 계획에서 다시 확인해야 합니다."], [105.3, 111.5, "첫 인사나 일정 조율 시간은 정규 차시로 인정되지 않는다는 점도 유의하세요."], [113.55, 115.55, "사례를 하나 보겠습니다."], [115.9, 128.9, "15쪽 전주대정초등학교는 전체 발표 대신 줌 소회의실 여섯 개로 나누어 우리 학생이 호스트를 맡게 했고, 인원이 다른 학교와도 일대이 버디로 짝을 맞췄습니다."], [129.25, 138.05, "수소에너지고등학교는 비실시간으로 공정 영상을 먼저 보고, 실시간 수업에서 PLC 공정을 발표했습니다."], [140.1, 150.5, "해외현장체험학습 연계형은 단순 관광이 아니라 온라인에서 다룬 주제를 현지에서 실험과 토론, 공동 발표로 넓히는 과정입니다."], [150.85, 158.85, "17쪽처럼 사전, 현지, 사후 세 단계로 나누어 계획하고, 현장체험학습 컨설팅도 활용할 수 있습니다."], [159.2, 163.0, "세부 행정은 4장과 5장에서 따라가겠습니다."], [165.05, 170.25, "초청수업은 19쪽과 20쪽의 여섯 단계 업무 흐름을 따릅니다."], [170.6, 179.8, "방문 협의, 교내 협의와 계획 수립, 양교 세부사항 확정, 사전 준비와 점검, 초청수업 운영, 사후 정리와 후속 교류입니다."], [180.15, 184.75, "두 번째 단계에서 운영계획을 내부결재로 남겨야 합니다."], [186.8, 199.6, "초청 운영계획은 공문 본문에는 목적과 기간, 대상, 주요 내용만 간단히 적고, 세부 내용은 부록 4-1 국제교류 초청프로그램 운영계획서를 붙임으로 첨부합니다."], [199.95, 204.75, "양교 협의가 진행되는 대로 여덟 개 항목을 채워 가면 됩니다."], [206.8, 213.4, "초청 경비의 세목은 2026학년도 학교회계 예산편성 및 운영지침을 따릅니다."], [213.75, 222.15, "매뉴얼 23쪽에 교육운영비와 일반업무추진비, 외빈초청여비, 강사수당 항목이 출처로 적혀 있습니다."], [222.5, 227.1, "실제 편성 전에는 행정실과 해당 연도 지침을 확인하세요."], [229.15, 231.15, "2장 체크리스트입니다."], [231.5, 239.9, "운영형태를 정하고 6차시 편성안까지 만들었다면, 이제 3장에서 함께할 해외학교를 찾아보겠습니다."], [243.45, 249.85, "행정절차와 제출서류는 업무의 성격이나 지침 개정에 따라 달라질 수 있습니다."], [250.2, 256.2, "실제 추진 전에는 해당 연도 교육청 지침과 관련 법령을 다시 확인해 주세요."]], "check": ["운영형태(온라인 필수 + 현장체험·초청 선택)를 정했다", "실시간 3·비실시간 3 이상 6차시 편성안 초안을 만들었다", "실시간 수업 시간을 양국 시간으로 함께 적었다", "초청 시 부록Ⅳ-1 항목과 경비 세목을 행정실과 확인했다"], "file": "videos/02.mp4", "vtt": "subs/02.vtt"}, {"id": "ch03", "key": "CH03", "no": "03", "title": "해외학교 매칭", "sub": "첫 연락부터 교류 성사까지", "goal": "해외 교류학교를 탐색하고 최초 연락부터 실제 교류 성사까지 수행할 수 있다.", "why": "국제교류를 시작하려는 교사가 가장 먼저 어려움을 겪는 일이 적합한 해외학교를 찾고 연결하는 과정이기 때문에 별도 장으로 구성했습니다.", "pages": "26~47쪽", "practice": "학교 소개 한 장 만들기, 첫 연락 메시지 작성, 연락 기록표 만들기", "dur": 271.9, "srcs": [{"t": "국제교류수업 운영 매뉴얼(본 매뉴얼)", "o": "전북특별자치도교육청", "d": "2026", "k": "매뉴얼 자체(실무 권장)", "c": "case", "n": "법적 구속력 없는 교사용 업무 참고서"}, {"t": "도내 학교 국제교류수업 운영 사례(사례 예시·매칭 수기)", "o": "도내 초·중·고 집필 교사", "d": "2024~2026", "k": "학교 사례", "c": "case", "n": "법적 기준이 아닌 실천 사례"}], "scenes": [{"t": 0, "label": "이 장을 따로 구성한 이유", "page": "26쪽", "act": "", "src": ""}, {"t": 19.75, "label": "매칭 요청 시 제시할 4가지 정보", "page": "27~28쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 45.85, "label": "플랫폼별 이용 절차(29쪽 요약)", "page": "29쪽", "act": "", "src": "매뉴얼(실무 권장)(플랫폼 현재 기능은 확인 필요)"}, {"t": 70.2, "label": "이메일 3단락 · 2주 후 1회 팔로업", "page": "30~31쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 93.95, "label": "매칭 방법별 비교", "page": "31~32쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 117.7, "label": "첫 교류까지 6단계", "page": "33쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 135.25, "label": "학교 소개 한 장", "page": "34쪽", "act": "우리 학교 소개 한 장 초안 작성", "src": "매뉴얼(실무 권장) · 학교 사례"}, {"t": 159.6, "label": "첫 연락 메시지 — 3단락으로 쓰기", "page": "31·33·34쪽", "act": "첫 메시지 작성·발송·기록", "src": "매뉴얼(실무 권장)"}, {"t": 183.75, "label": "매칭 수기 4편 — 걸린 시간 비교", "page": "35~47쪽", "act": "", "src": "학교 사례(학교 사례)"}, {"t": 210.5, "label": "ISNet 사례 — 날짜별 진행", "page": "38~40쪽", "act": "", "src": "학교 사례(학교 사례)"}, {"t": 241.2, "label": "3장 업무 완료 체크리스트", "page": "", "act": "체크리스트 확인", "src": ""}, {"t": 257.1, "label": "마무리 · 다음 단계", "page": "", "act": "", "src": ""}], "cues": [[0.8, 3.0, "3장 해외학교 매칭입니다."], [3.35, 8.75, "국제교류를 하고 싶어도 함께할 학교가 없으면 시작할 수 없습니다."], [9.1, 18.5, "이 장에서는 학교를 찾는 세 가지 길과 첫 연락 방법, 그리고 실제로 매칭에 성공한 네 학교의 과정을 따라가 보겠습니다."], [20.55, 22.55, "27쪽과 28쪽입니다."], [22.9, 30.9, "해외학교를 찾는 길은 공식 플랫폼과 기관, SNS와 이메일 직접 섭외, 교사 네트워크 세 가지입니다."], [31.25, 36.85, "한 가지만 고집하지 말고 여러 경로를 동시에 쓰는 것이 효과적입니다."], [37.2, 44.6, "그리고 연락할 때는 교류할 학교를 찾는다는 말 대신, 네 가지 정보를 구체적으로 제시하세요."], [46.65, 51.05, "플랫폼별 이용 절차는 29쪽 표에 정리되어 있습니다."], [51.4, 61.2, "ISNet, ePals, 한국교육원, 유네스코학교, iEARN은 처음 시작하는 학교가 먼저 시도해 볼 수 있는 곳입니다."], [61.55, 68.95, "다만 플랫폼의 메뉴와 가입 방식은 바뀔 수 있으니, 실제 이용할 때 현재 화면을 확인해 주세요."], [71.0, 73.0, "직접 섭외도 가능합니다."], [73.35, 84.35, "30쪽과 31쪽처럼 페이스북 교사 교류 그룹에 구인 글을 올리거나, 해외학교 홈페이지에서 교사 이메일을 찾아 제안 메일을 보냅니다."], [84.7, 92.7, "메일은 학교 소개, 교류 목적, 희망 활동의 세 단락으로 쓰고, 2주간 답이 없으면 한 번만 다시 보냅니다."], [94.75, 98.75, "가장 신뢰도가 높은 방법은 교사 네트워크입니다."], [99.1, 108.9, "국제 교원 연수에서 만난 교사, 기존 교류학교의 소개, 국제교류 연구회의 파트너 공유 시트를 활용하면 성사율이 높습니다."], [109.25, 116.45, "32쪽 비교표처럼 처음이라면 플랫폼과 네트워크 문의를 함께 시작하는 것이 좋습니다."], [118.5, 121.9, "33쪽의 여섯 단계를 따라가 보겠습니다."], [122.25, 126.85, "목표 설정, 방법 선택, 첫 접촉, 협의, 확정, 첫 교류 활동입니다."], [127.2, 134.0, "핵심은 완벽하게 준비한 뒤 시작하는 것이 아니라, 작은 연결부터 시작하는 것입니다."], [136.05, 140.85, "첫 연락에는 학교 소개 한 장을 붙이면 회신율이 높아집니다."], [141.2, 154.0, "34쪽에는 학교 기본 정보, 전공과 특색, 희망 교류 주제, 참여 학생, 교류 가능 시간, 교류 실적과 연락처를 담는 요령과 수소에너지고등학교 영문 예시가 있습니다."], [154.35, 158.35, "시간은 한국 시간과 상대국 시차를 함께 적으세요."], [160.4, 163.4, "이제 실제 첫 메시지를 써 보겠습니다."], [163.75, 176.15, "첫 문단에는 학교명과 위치, 학교급과 학생 수를, 두 번째 문단에는 교류 목적과 희망 주제를, 세 번째 문단에는 희망 활동과 가능한 시기, 사용 언어를 적습니다."], [176.5, 182.5, "마지막에 학교 소개 한 장을 첨부하고, 보낸 날짜를 연락 기록표에 남깁니다."], [184.55, 188.55, "매뉴얼에는 네 학교의 매칭 수기가 실려 있습니다."], [188.9, 201.7, "전주대정초는 Global Scholars에서 첫 연락 당일 계획을 합의했고, 임피중은 ISNet으로 이틀 만에 매칭한 뒤 MOU까지 이어 갔습니다."], [202.05, 209.25, "전주화정중은 ePals로 약 1주, 만경고는 페이스북 그룹으로 약 3주가 걸렸습니다."], [211.3, 214.5, "임피중 사례를 날짜 순서로 보겠습니다."], [214.85, 224.25, "ISNet에 학교 소개와 교류 제안을 올리고, 관심 학교에 첫 제안 메일을 보낸 뒤, 왓츠앱으로 소통을 이어 갔습니다."], [224.6, 232.0, "이후 Padlet으로 첫 비실시간 교류를 하고, 다음 해 2월 양교 MOU를 체결했습니다."], [232.35, 239.95, "작은 학교라도 학교 규모와 학생들의 의지를 솔직하게 소개하면 만남이 빠르게 이루어집니다."], [242.0, 244.0, "3장 체크리스트입니다."], [244.35, 254.35, "학교 소개 한 장과 첫 메시지를 보냈고 연락 기록을 남겼다면, 4장 연간 업무로 넘어가 공모와 위원회 구성을 진행하겠습니다."], [257.9, 264.3, "행정절차와 제출서류는 업무의 성격이나 지침 개정에 따라 달라질 수 있습니다."], [264.65, 270.65, "실제 추진 전에는 해당 연도 교육청 지침과 관련 법령을 다시 확인해 주세요."]], "check": ["매칭 요청 시 제시할 4가지 정보를 정리했다", "플랫폼 1곳 이상 가입하고 네트워크 문의를 병행했다", "학교 소개 한 장(영문)을 만들었다", "3단락 첫 메시지를 보내고 발송일을 기록했다(2주 후 1회 팔로업)"], "file": "videos/03.mp4", "vtt": "subs/03.vtt"}, {"id": "ch04", "key": "CH04", "no": "04", "title": "연간 업무매뉴얼", "sub": "2월부터 12월까지 따라 하기", "goal": "교사가 매뉴얼을 활용하여 국제교류 업무를 1년 동안 단계별로 추진할 수 있다.", "why": "실제 담당자가 연간 계획에 따라 무엇을, 언제, 어떤 공문과 결재로 처리하는지를 순서대로 따라 할 수 있도록 만든 핵심 실무 장입니다.", "pages": "48~65쪽", "practice": "공모 신청 공문·위원회 구성 내부결재·학운위 상정·사전자료 제출·공무국외출장 신청·결과보고 등록", "dur": 448.2, "srcs": [{"t": "국제교류수업 운영 매뉴얼(본 매뉴얼)", "o": "전북특별자치도교육청", "d": "2026", "k": "매뉴얼 자체(실무 권장)", "c": "case", "n": "법적 구속력 없는 교사용 업무 참고서"}, {"t": "해당 연도 국제교류수업 공모·운영 계획(공문)", "o": "전북특별자치도교육청 정책기획과", "d": "매년", "k": "교육청 공문", "c": "gov", "n": "공모 일정, 최소 6차시(실시간 3·비실시간 3), 사전·사후 제출 서류 — 매년 원문 확인 필요"}, {"t": "초·중등교육법 제32조", "o": "법률", "d": "현행", "k": "법률", "c": "law", "n": "학교운영위원회 심의 사항(학부모 경비 부담 등)"}, {"t": "전북특별자치도 협상에 의한 계약 제안서평가위원회 설치 및 운영규칙", "o": "전북특별자치도", "d": "현행", "k": "자치법규(규칙)", "c": "law", "n": "평가위원회 7인 이상 10인 이내, 위원장 호선"}, {"t": "2026 현장체험학습 길라잡이", "o": "전북특별자치도교육청 민주시민교육과", "d": "2026. 2.", "k": "교육청 안내자료", "c": "gov", "n": "인솔교사 자격(학교안전교육 직무연수 15시간·3년), 인솔·안전요원 배치, 보험(국외 실비 전액 보상·구조송환비용 특약) 등"}, {"t": "학생 해외연수 안전 길라잡이", "o": "전북특별자치도교육청 정책기획과", "d": "2026. 4.", "k": "교육청 안내자료", "c": "gov", "n": "해외연수 안전요원 배치 기준, 사안 보고 체계, 단계별 체크리스트"}, {"t": "전북특별자치도교육감 소속 공무원의 공무국외출장 규정", "o": "전북특별자치도교육청 (교육훈령 제308호)", "d": "2026. 5. 1. 시행", "k": "행정규칙(훈령)", "c": "law", "n": "허가권자(제3조제1항), 심사 대상(제5조), 별표 제1호 심사 기준, 별지 제1~6호 서식"}], "scenes": [{"t": 0, "label": "이 장을 따로 구성한 이유", "page": "48쪽", "act": "", "src": ""}, {"t": 19.55, "label": "연간 운영 타임라인", "page": "53쪽", "act": "타임라인 출력", "src": "매뉴얼(실무 권장)"}, {"t": 41.3, "label": "2~3월 주요 업무 6가지", "page": "49쪽", "act": "", "src": "매뉴얼(실무 권장) · 해당 연도 공모·운영 계획"}, {"t": 64.7, "label": "공모 신청 대외 발송 공문", "page": "50쪽", "act": "K-에듀파인에서 대외 공문 작성", "src": "매뉴얼(실무 권장) · 해당 연도 공모·운영 계획"}, {"t": 87.45, "label": "활성화위원회 구성", "page": "51쪽", "act": "위원회 구성 내부결재", "src": "매뉴얼(실무 권장)"}, {"t": 113.55, "label": "위원회 협의 ≠ 학운위 심의", "page": "52쪽", "act": "", "src": "초·중등교육법(법률) · 매뉴얼(실무 권장)"}, {"t": 139.3, "label": "4~5월 필요 서류", "page": "53~54쪽", "act": "세부 운영계획서·선발 기준 내부결재", "src": "매뉴얼(실무 권장)"}, {"t": 163.85, "label": "평가위원회 7~10인", "page": "54쪽", "act": "", "src": "평가위원회 운영규칙(규칙) · 매뉴얼(실무 권장)"}, {"t": 188.25, "label": "MOU 예시(한·영)", "page": "55~56쪽", "act": "", "src": "매뉴얼(실무 권장) · 학교 사례"}, {"t": 211.8, "label": "6차시 표준 프레임워크", "page": "56~58쪽", "act": "공개수업 운영계획 내부결재", "src": "해당 연도 공모·운영 계획 · 매뉴얼(실무 권장)"}, {"t": 238.9, "label": "인솔교사 필수 연수 2가지", "page": "58쪽", "act": "이수증·허가문서를 내부결재에 첨부", "src": "현장체험학습 길라잡이 p.4~7"}, {"t": 268.4, "label": "20명 내외 인솔·안전요원 기준", "page": "59쪽", "act": "", "src": "현장체험학습 길라잡이 p.4~7 · 해외연수 안전 길라잡이 p.13·15"}, {"t": 293.55, "label": "사전·사후 제출 서류", "page": "59~60쪽", "act": "제출 일정표 작성", "src": "해당 연도 공모·운영 계획 · 매뉴얼(실무 권장)"}, {"t": 320.9, "label": "사전자료 제출(내부결재 예시)", "page": "61~62쪽", "act": "사전자료 제출 공문 작성", "src": "매뉴얼(실무 권장)"}, {"t": 345.45, "label": "공무국외출장 3가지 상황", "page": "63~64쪽", "act": "우리 학교 허가권자 확인", "src": "공무국외출장 규정(훈령 제308호) 제3조·제5조"}, {"t": 374.55, "label": "결과보고 30일 · 표절률 30% 미만", "page": "64쪽", "act": "결과보고서 표절 검사 후 시스템 등록", "src": "공무국외출장 규정 · 해당 연도 공모·운영 계획 · 매뉴얼(실무 권장)"}, {"t": 398.1, "label": "자료 보관 표준 폴더", "page": "65쪽", "act": "표준 폴더 9개 만들기", "src": "매뉴얼(실무 권장)"}, {"t": 417.9, "label": "4장 업무 완료 체크리스트", "page": "", "act": "체크리스트 확인", "src": ""}, {"t": 433.35, "label": "마무리 · 다음 단계", "page": "", "act": "", "src": ""}], "cues": [[0.8, 3.2, "4장 연간 업무매뉴얼입니다."], [3.55, 6.15, "이 장이 전체 영상의 중심입니다."], [6.5, 18.3, "53쪽의 연간 운영 타임라인을 화면 왼쪽에 계속 띄워 두고, 지금 몇 월의 어떤 일을 하는지 표시하면서 2월부터 12월까지 함께 진행하겠습니다."], [20.35, 22.75, "먼저 53쪽 타임라인입니다."], [23.1, 34.1, "계획과 매칭, 위원회 회의, 온라인 공동수업, 현장체험 준비, 실시, 사후 정리가 월별 막대로 표시되어 있고, 마름모는 회의와 심의 시점입니다."], [34.45, 40.05, "이 표를 출력해 책상에 붙여 두면 지금 단계를 바로 확인할 수 있습니다."], [42.1, 45.3, "2월과 3월에 할 일은 여섯 가지입니다."], [45.65, 63.45, "학교교육계획에 국제교류수업 시수를 반영하고, 공모 공문을 확인해 기한 안에 신청서와 사업계획서를 내고, 활성화위원회를 구성하고, 교류학교를 탐색하고, 영문 홍보자료와 개인정보·초상권 동의서 양식을 준비합니다."], [65.5, 68.7, "공모 신청은 대외 발송 공문으로 합니다."], [69.05, 79.85, "50쪽 예시처럼 수신은 전북특별자치도교육감, 정책기획과장이고, 제목은 해당 학년도 국제교류수업 학교 공모 신청서 제출입니다."], [80.2, 86.2, "본문에는 관련 공문을 적고, 붙임으로 신청서와 운영계획서를 첨부합니다."], [88.25, 91.45, "다음은 국제교류 활성화위원회입니다."], [91.8, 103.0, "51쪽처럼 교감 또는 학교장이 지정한 사람이 위원장을 맡고, 담당교사와 관련 교과, 안전·생활지도, 진로진학, 행정실 담당자로 구성합니다."], [103.35, 109.55, "기존 위원회가 같은 기능을 할 수 있으면 그 위원회에 포함해 운영해도 됩니다."], [109.9, 112.3, "구성은 내부결재로 남깁니다."], [114.35, 117.35, "여기서 반드시 구분할 것이 있습니다."], [117.7, 123.3, "활성화위원회의 협의는 학교운영위원회 심의를 대신할 수 없습니다."], [123.65, 138.05, "학부모 경비 부담이 생기는 경우 초·중등교육법 제32조 등에 따라 학교운영위원회 심의를 거쳐야 하고, 운영계획과 선발 기준, 숙박, 교통, 일정, 안전, 예산은 학운위 심의 대상입니다."], [140.1, 143.7, "4월과 5월에는 운영의 뼈대를 설계합니다."], [144.05, 156.85, "교류학교가 확정되면 대주제와 차시 일정, 플랫폼, 산출물을 합의하고, 방문형이라면 학생 선발 전형, 학운위 심의 안건, 예산 편성, 과업지시서 작성을 시작합니다."], [157.2, 162.6, "54쪽에 이 시기 내부결재, 학운위, 계약 서류가 정리되어 있습니다."], [164.65, 178.65, "업체 선정에 쓰는 제안서 평가위원회는 전북특별자치도 협상에 의한 계약 제안서평가위원회 설치 및 운영규칙에 따라 위원장을 포함해 7인 이상 10인 이내로 구성합니다."], [179.0, 187.0, "외부위원 인원은 규칙에 따로 정해져 있지 않으므로 교육지원청 계약 담당 부서와 협의해 정합니다."], [189.05, 195.25, "교류학교와 협약을 맺는다면 55쪽과 56쪽의 MOU 예시를 활용합니다."], [195.6, 202.0, "한국어와 영어로 목적, 협력 범위, 역할과 책임, 효력과 해지 조항이 실려 있습니다."], [202.35, 210.55, "실제 사례에서 학교명과 인명을 지운 참고 양식이므로 교류 내용에 맞게 조항을 더하거나 빼서 쓰세요."], [212.6, 218.2, "6월과 7월은 온라인 공동수업이 본격적으로 진행되는 시기입니다."], [218.55, 227.15, "최소 6차시, 실시간 3차시와 비실시간 3차시를 운영하고 공개수업과 장학 컨설팅 참관에도 대비합니다."], [227.5, 230.1, "수업은 화려할 필요가 없습니다."], [230.45, 237.65, "학생이 교류 언어로 자신의 내용을 전달하려고 노력하는 과정 자체가 가장 큰 가치입니다."], [239.7, 243.5, "8월부터 10월은 체험과 나눔의 시기입니다."], [243.85, 247.85, "인솔교사가 반드시 이수할 연수는 두 가지입니다."], [248.2, 257.4, "학교안전교육 직무연수 15시간을 3년 안에 이수해야 하고, 출발 전 학교 자체 인솔자 사전연수를 받아야 합니다."], [257.75, 267.15, "여기에 공무국외출장 허가와 여행자보험 가입까지 갖추면 정해진 절차에 따른 공무 수행으로 인정받을 수 있습니다."], [269.2, 276.4, "학생 20명 내외의 국제교류라면 인솔교사는 학생 10명당 1명, 그러니까 2명입니다."], [276.75, 282.55, "안전요원은 50명당 1명 기준이라 50명 미만은 해당하지 않습니다."], [282.9, 292.3, "여행사 인솔자는 국외여행인솔자 자격증 사본을 받고, 성범죄·아동학대 전력은 학교장이 관할 경찰서에 조회합니다."], [294.35, 299.15, "출국 전후 제출 서류는 60쪽 표를 그대로 따라가면 됩니다."], [299.5, 308.5, "참가자 명단은 출발 전, 학운위 최종 심의본 계획서도 출발 전에 업무관리시스템으로 정책기획과에 제출합니다."], [308.85, 319.65, "만족도 조사, 우수 소감문 2편, 사진 10매, 2~3분 영상, 초상권 동의서는 종료 후 30일 이내, 용역 계약서는 정산 후 10일 이내입니다."], [321.7, 327.3, "사전자료 제출은 61쪽과 62쪽의 내부결재 예시처럼 처리합니다."], [327.65, 336.65, "제목은 해외현장체험학습 사전자료 제출이고, 붙임에 학운위 최종 심의본 계획서와 참가자 명단을 첨부합니다."], [337.0, 344.2, "출국 전에 사진과 영상 제출 기준을 미리 알고 가야 현지에서 빠짐없이 촬영할 수 있습니다."], [346.25, 350.65, "공무국외출장은 63쪽의 세 가지 상황으로 나눕니다."], [351.0, 364.2, "사전답사는 2026년 5월 개정으로 위원회 심사 대상이 되었고, 학교장이 동행하지 않는 단독 인솔은 학운위 심의를 거쳤다면 심사 없이 허가만으로 진행합니다."], [364.55, 367.95, "학교장이 동행하면 다시 심사 대상입니다."], [368.3, 373.3, "허가권자는 출장자가 소속된 학교의 관할에 따라 정해집니다."], [375.35, 378.55, "11월과 12월은 마무리 시기입니다."], [378.9, 389.7, "귀국 후 30일 이내에 결과보고서를 국외출장연수정보시스템에 등록하고, 업무관리시스템으로 정산과 결과보고를 결재받습니다."], [390.05, 396.85, "결과보고서는 표절 검사를 거쳐야 하며, 표절률이 30% 이상이면 승인되지 않습니다."], [398.9, 401.5, "마지막으로 자료를 정리합니다."], [401.85, 416.65, "65쪽의 표준 폴더 구조처럼 운영기본계획부터 최종 결과보고와 정산까지 아홉 개 폴더로 나누어 보관하면, 결과보고가 쉬워지고 다음 해 담당자에게 그대로 인수인계할 수 있습니다."], [418.7, 420.7, "4장 체크리스트입니다."], [421.05, 425.05, "각 시기의 결재와 제출을 마쳤는지 확인해 보세요."], [425.4, 430.6, "예산 집행과 낙찰차액 처리는 5장에서 더 자세히 다루겠습니다."], [434.15, 440.55, "행정절차와 제출서류는 업무의 성격이나 지침 개정에 따라 달라질 수 있습니다."], [440.9, 446.9, "실제 추진 전에는 해당 연도 교육청 지침과 관련 법령을 다시 확인해 주세요."]], "check": ["2~3월: 공모 신청 공문 발송, 활성화위원회 구성 내부결재", "4~5월: 세부 운영계획·선발 기준 결재, 학운위 심의, 과업지시서 착수", "6~7월: 6차시 운영, 공개수업 운영계획 결재, 공무국외출장 신청", "8~10월: 인솔교사 연수 이수증 확보, 명단·계획서 사전 제출", "11~12월: 30일 이내 결과보고 등록(표절률 30% 미만), 정산·자료 폴더 정리"], "file": "videos/04.mp4", "vtt": "subs/04.vtt"}, {"id": "ch05", "key": "CH05", "no": "05", "title": "행정절차 매뉴얼", "sub": "결재·계약·정산 흐름 잡기", "goal": "국제교류에 필요한 행정절차를 이해하고 필요한 내부결재와 서류를 준비할 수 있다.", "why": "국제교류수업의 교육적 운영과 행정 처리는 서로 연결되지만, 예산·계약·정산은 별도의 검토와 절차가 필요하고 행정실과 역할을 나누어야 하기 때문에 따로 구성했습니다.", "pages": "66~68쪽", "practice": "11단계 로드맵에 주관 주체 표시, 낙찰차액 처리 판단", "dur": 214.0, "srcs": [{"t": "국제교류수업 운영 매뉴얼(본 매뉴얼)", "o": "전북특별자치도교육청", "d": "2026", "k": "매뉴얼 자체(실무 권장)", "c": "case", "n": "법적 구속력 없는 교사용 업무 참고서"}, {"t": "해당 연도 국제교류수업 공모·운영 계획(공문)", "o": "전북특별자치도교육청 정책기획과", "d": "매년", "k": "교육청 공문", "c": "gov", "n": "공모 일정, 최소 6차시(실시간 3·비실시간 3), 사전·사후 제출 서류 — 매년 원문 확인 필요"}, {"t": "도내 학교 국제교류수업 운영 사례(사례 예시·매칭 수기)", "o": "도내 초·중·고 집필 교사", "d": "2024~2026", "k": "학교 사례", "c": "case", "n": "법적 기준이 아닌 실천 사례"}], "scenes": [{"t": 0, "label": "이 장을 따로 구성한 이유", "page": "66쪽", "act": "", "src": ""}, {"t": 21.35, "label": "행정절차 11단계", "page": "67쪽", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 45.75, "label": "단계별 주관 주체(67쪽 요약)", "page": "67쪽", "act": "단계별 주관 주체 표시", "src": "매뉴얼(실무 권장)"}, {"t": 69.7, "label": "목적사업비 — 입찰과 낙찰차액", "page": "67쪽", "act": "", "src": "매뉴얼(실무 권장) · 해당 연도 공모·운영 계획"}, {"t": 90.1, "label": "낙찰차액 3원칙", "page": "68쪽", "act": "", "src": "매뉴얼(실무 권장) · 해당 연도 공모·운영 계획(교육청 반납 안내 공문)"}, {"t": 114.8, "label": "낙찰차액이 생겼을 때 — 판단 순서", "page": "68쪽", "act": "추가 계약 또는 반납 결정", "src": "매뉴얼(실무 권장)"}, {"t": 142.15, "label": "사례 — 변경계약으로 학생 1명 추가", "page": "68쪽", "act": "", "src": "학교 사례(학교 사례)"}, {"t": 163.55, "label": "유의사항", "page": "", "act": "", "src": "매뉴얼(실무 권장)"}, {"t": 184.1, "label": "5장 업무 완료 체크리스트", "page": "", "act": "체크리스트 확인", "src": ""}, {"t": 199.2, "label": "마무리 · 다음 단계", "page": "", "act": "", "src": ""}], "cues": [[0.8, 3.2, "5장 행정절차 매뉴얼입니다."], [3.55, 9.95, "수업은 교사가 설계하지만 예산과 계약, 정산은 행정실과 함께 움직여야 합니다."], [10.3, 20.1, "이 장에서는 기획부터 반납까지의 행정 흐름과, 정산 단계에서 가장 자주 문제가 되는 낙찰차액 처리를 따라가 보겠습니다."], [22.15, 26.75, "67쪽의 행정절차 전체 워크플로우는 열한 단계입니다."], [27.1, 44.5, "공모 계획 확인부터 기본 운영계획 내부결재, 공모 신청, 위원회 조직, 학생 선발, 학운위 심의, 성립전 예산 편성, 계약 기초서류 작성, 나라장터 입찰과 계약, 공무국외출장과 안전교육, 결과보고와 정산 마감까지 이어집니다."], [46.55, 49.55, "표의 오른쪽 주관 주체 열을 꼭 보세요."], [49.9, 61.7, "대부분은 담당 교사가 주관하지만, 9단계 나라장터 입찰 공고와 용역 계약은 행정실이 주관하고, 마지막 정산은 담당 교사와 행정실이 함께합니다."], [62.05, 68.45, "단계마다 누가 주관하는지 먼저 확인해 두면 업무가 겹치거나 빠지지 않습니다."], [70.5, 83.9, "국제교류 목적사업비는 항공과 숙박, 현지 프로그램을 묶은 여행 용역으로 집행되는 경우가 대부분이고, 나라장터 공개입찰, 협상에 의한 계약으로 업체를 선정합니다."], [84.25, 88.85, "이때 예정가격과 실제 낙찰가의 차이가 낙찰차액입니다."], [90.9, 94.1, "68쪽의 낙찰차액 처리 3원칙입니다."], [94.45, 99.85, "원칙은 전액 반납이고, 10만 원 이하는 반납 대상에서 제외됩니다."], [100.2, 107.0, "허용되는 것은 차액 범위에서 참가 학생을 추가로 선발해 변경계약하는 것뿐입니다."], [107.35, 113.55, "기념품이나 교재, 행사비, 다른 국제교류 운영비로 돌려 쓰는 것은 금지됩니다."], [115.6, 117.8, "판단은 이렇게 하면 됩니다."], [118.15, 126.15, "차액이 남았으니 무엇을 더 할까가 아니라, 이 차액으로 학생을 한 명 더 데려갈 수 있는가만 묻습니다."], [126.5, 140.9, "가능하다면 도교육청과 먼저 협의해 내부결재로 남기고, 같은 선발 기준을 적용하고, 학운위 심의 변경 여부와 보험, 여권 일정을 다시 점검한 뒤 변경계약서를 행정실과 작성합니다."], [142.95, 156.15, "수소에너지고등학교는 2025년과 2026년 입찰 뒤 낙찰차액이 학생 1인당 용역비보다 커서, 계약을 변경해 학생 1명을 추가로 선발해 함께 다녀왔습니다."], [156.5, 162.3, "추가 학생의 항공, 식비, 숙박, 보험료는 변경계약 금액에 포함되었습니다."], [164.35, 166.35, "한 가지 더 말씀드립니다."], [166.7, 171.9, "예산, 계약, 출장, 현장체험학습은 각각 적용되는 규정이 다릅니다."], [172.25, 182.85, "매뉴얼은 흐름을 한 장에 모아 보여 주지만, 실제 처리 기준은 각 규정과 해당 연도 교육청 지침, 그리고 행정실의 확인을 따라야 합니다."], [184.9, 186.9, "5장 체크리스트입니다."], [187.25, 196.45, "행정 흐름과 차액 처리를 정리했다면, 6장에서 학생 활동을 학교생활기록부에 어떻게 기록할지 살펴보겠습니다."], [200.0, 206.4, "행정절차와 제출서류는 업무의 성격이나 지침 개정에 따라 달라질 수 있습니다."], [206.75, 212.75, "실제 추진 전에는 해당 연도 교육청 지침과 관련 법령을 다시 확인해 주세요."]], "check": ["11단계 중 담당 교사·행정실 주관 단계를 구분했다", "성립전 예산 편성 일정을 행정실과 맞췄다", "낙찰차액 발생 시 추가 계약/반납 판단 기준을 알고 있다", "정산서에 예정가격·낙찰가·차액·반납액을 적을 준비를 했다"], "file": "videos/05.mp4", "vtt": "subs/05.vtt"}, {"id": "ch06", "key": "CH06", "no": "06", "title": "학교생활기록부 기재 가이드", "sub": "무엇을, 어디에, 어떻게 쓸까", "goal": "국제교류 활동의 교육적 성과를 확인하고 학교생활기록부에 적절히 기재하는 방법을 이해한다.", "why": "수업이 끝난 뒤에도 학생의 실제 참여와 성장이 기록으로 이어지도록, 기재 가능 범위와 서술 방법을 따로 안내하기 위해 구성했습니다.", "pages": "69~73쪽", "practice": "우리 학교 활동이 기재 가능한지 판단, 관찰 기록 메모로 특기사항 초안 작성", "dur": 228.6, "srcs": [{"t": "2026학년도 학교생활기록부 기재요령(고등학교)", "o": "교육부", "d": "2026학년도", "k": "교육부 기재요령", "c": "gov", "n": "창의적 체험활동 특기사항 입력 요건, 국외 활동 기재 제한, 자율동아리 기재 방식"}, {"t": "국제교류수업 운영 매뉴얼(본 매뉴얼)", "o": "전북특별자치도교육청", "d": "2026", "k": "매뉴얼 자체(실무 권장)", "c": "case", "n": "법적 구속력 없는 교사용 업무 참고서"}], "scenes": [{"t": 0, "label": "이 장을 따로 구성한 이유", "page": "69쪽", "act": "", "src": ""}, {"t": 21.5, "label": "기재요령 → 70쪽", "page": "70쪽", "act": "", "src": "학생부 기재요령(교육부 기재요령)"}, {"t": 42.5, "label": "기재 가능 요건", "page": "70쪽", "act": "", "src": "학생부 기재요령"}, {"t": 68.1, "label": "국외 활동 기재 제한", "page": "70쪽", "act": "", "src": "학생부 기재요령"}, {"t": 98.0, "label": "서술 원칙 — 관찰·명사형 종결", "page": "70쪽", "act": "", "src": "학생부 기재요령 · 매뉴얼(실무 권장)"}, {"t": 123.95, "label": "성장 유형 6가지", "page": "71쪽", "act": "관찰 메모 양식 만들기", "src": "매뉴얼(실무 권장)"}, {"t": 148.3, "label": "특기사항 한 문장 만들기", "page": "71~72쪽", "act": "학생 1명 특기사항 초안 작성", "src": "매뉴얼(실무 권장)"}, {"t": 178.3, "label": "동아리 운영 시 기재 방식(73쪽)", "page": "73쪽", "act": "", "src": "학생부 기재요령"}, {"t": 200.05, "label": "6장 업무 완료 체크리스트", "page": "", "act": "체크리스트 확인", "src": ""}, {"t": 213.75, "label": "마무리 · 다음 단계", "page": "", "act": "", "src": ""}], "cues": [[0.8, 4.2, "6장 학교생활기록부 기재 가이드입니다."], [4.55, 9.35, "교류가 끝나면 학생의 성장을 기록으로 남기고 싶어집니다."], [9.7, 14.3, "하지만 모든 국제교류 활동을 적을 수 있는 것은 아닙니다."], [14.65, 20.25, "먼저 기재할 수 있는지부터 판단하고, 그다음 어떻게 쓸지 보겠습니다."], [22.3, 30.1, "이 가이드는 2026학년도 학교생활기록부 기재요령, 고등학교용을 근거로 작성되었습니다."], [30.45, 41.25, "기재요령은 매년 개정되고 학교급마다 다르므로, 실제 입력 전에는 해당 학년도와 학교급의 기재요령을 반드시 다시 확인해야 합니다."], [43.3, 55.7, "창의적 체험활동 특기사항은 활동 장소가 국내이면서, 학교교육계획에 따라 학교가 주최·주관한 활동 등 네 가지 중 하나에 해당할 때만 입력할 수 있습니다."], [56.05, 66.85, "온라인 국제교류수업은 교실, 즉 국내에서 이루어지므로 요건을 충족하면 자율활동이나 동아리활동 특기사항에 입력할 수 있습니다."], [68.9, 71.5, "해외현장체험학습은 다릅니다."], [71.85, 82.25, "활동 장소가 국외이므로 정규교육과정의 자율·자치활동으로 실시한 경우 이수시간만 인정되고 특기사항은 입력할 수 없습니다."], [82.6, 89.8, "동아리나 진로활동으로 실시한 해외 활동은 이수시간도 특기사항도 입력할 수 없습니다."], [90.15, 96.75, "원칙적으로 기재할 수 있는 것은 국내에서 이루어진 온라인 국제교류활동입니다."], [98.8, 104.2, "서술은 학생의 감상이 아니라 교사가 관찰하고 평가한 내용입니다."], [104.55, 114.75, "느꼈다, 깨달았다 같은 표현 대신 태도를 보임, 모습을 나타냄, 역량을 기름처럼 관찰 가능한 행동과 변화를 명사형으로 끝냅니다."], [115.1, 122.7, "그리고 해외 협력학교라는 표현을 그대로 쓰고, 구체적인 학교명이나 기관명은 쓰지 않습니다."], [124.75, 130.75, "71쪽에는 국제교류에서 나타날 수 있는 여섯 가지 성장 유형이 있습니다."], [131.1, 141.3, "문화적 다양성 이해와 존중, 소통 능력과 문제해결력, 자문화 재인식, 협업과 공동체 의식, 세계시민의식, 진로 탐색의 확장입니다."], [141.65, 147.05, "수업 중에 학생을 관찰할 때 이 여섯 가지를 기준으로 메모해 두세요."], [149.1, 150.9, "실제로 써 보겠습니다."], [151.25, 153.85, "첫째, 활동명과 영역을 적습니다."], [154.2, 158.6, "예를 들어 국제교류 온라인 공동수업, 자율활동입니다."], [158.95, 162.35, "둘째, 학생이 한 구체적인 행동을 적습니다."], [162.7, 168.1, "셋째, 그 과정에서 관찰된 변화나 역량을 명사형으로 마무리합니다."], [168.45, 177.05, "71쪽과 72쪽 예시를 그대로 옮기지 말고, 학생이 실제로 보인 언행과 결과물을 반영해 고쳐 써야 합니다."], [179.1, 182.7, "동아리로 운영하는 경우는 구분해야 합니다."], [183.05, 190.05, "정규 동아리는 동아리명과 활동시간, 활동 내용과 학생 특성을 문장으로 쓸 수 있습니다."], [190.4, 198.8, "자율동아리는 학년당 1개, 공백 포함 30자 이내 동아리명만 입력하고 특기사항 문장은 쓸 수 없습니다."], [200.85, 202.85, "6장 체크리스트입니다."], [203.2, 211.0, "기재 가능 여부를 판단하고 관찰 메모를 남겼다면, 7장에서 위탁 용역 서류를 작성해 보겠습니다."], [214.55, 220.95, "행정절차와 제출서류는 업무의 성격이나 지침 개정에 따라 달라질 수 있습니다."], [221.3, 227.3, "실제 추진 전에는 해당 연도 교육청 지침과 관련 법령을 다시 확인해 주세요."]], "check": ["해당 학년도·학교급 기재요령을 확인했다", "우리 활동이 국내 활동이며 기재 요건을 충족하는지 판단했다", "해외현장체험학습은 특기사항 입력 불가임을 확인했다", "6가지 성장 유형으로 관찰 메모를 남기고 명사형으로 초안을 썼다"], "file": "videos/06.mp4", "vtt": "subs/06.vtt"}, {"id": "ch07", "key": "CH07", "no": "07", "title": "과업지시서·제안요청서", "sub": "위탁 용역 서류 작성하기", "goal": "국제교류 관련 위탁 업무에서 필요한 과업지시서 및 제안요청서를 이해하고 작성할 수 있다.", "why": "해외현장체험학습은 항공·숙박·현지 프로그램을 여행 용역으로 위탁하는 경우가 많아, 학교가 직접 하는 수업 업무와 별개로 과업 범위 설정과 업체 선정·계약 서류가 필요하기 때문에 따로 구성했습니다.", "pages": "74~113쪽", "practice": "과업지시서 사업 개요·용역 조건 작성, 제안요청서 평가 기준 확인, 별지 서식 준비", "dur": 303.9, "srcs": [{"t": "해외 현장체험학습 위탁 용역 과업내용서·제안요청서 예시 양식", "o": "전북특별자치도교육청 배포", "d": "2026", "k": "교육청 예시양식", "c": "gov", "n": "7장에 전문 수록, 원본 메모를 작성 요령 상자로 옮김"}, {"t": "지방자치단체를 당사자로 하는 계약에 관한 법률 시행령 제13조 · 관광진흥법 제3조", "o": "법령", "d": "현행", "k": "법령", "c": "law", "n": "용역업체 입찰참가 자격 요건, 여행업 등록"}, {"t": "전북특별자치도 협상에 의한 계약 제안서평가위원회 설치 및 운영규칙", "o": "전북특별자치도", "d": "현행", "k": "자치법규(규칙)", "c": "law", "n": "평가위원회 7인 이상 10인 이내, 위원장 호선"}, {"t": "2026 현장체험학습 길라잡이", "o": "전북특별자치도교육청 민주시민교육과", "d": "2026. 2.", "k": "교육청 안내자료", "c": "gov", "n": "인솔교사 자격(학교안전교육 직무연수 15시간·3년), 인솔·안전요원 배치, 보험(국외 실비 전액 보상·구조송환비용 특약) 등"}, {"t": "국제교류수업 운영 매뉴얼(본 매뉴얼)", "o": "전북특별자치도교육청", "d": "2026", "k": "매뉴얼 자체(실무 권장)", "c": "case", "n": "법적 구속력 없는 교사용 업무 참고서"}], "scenes": [{"t": 0, "label": "이 장을 따로 구성한 이유", "page": "74쪽", "act": "", "src": ""}, {"t": 21.15, "label": "교육청 예시양식 → 7장", "page": "75쪽", "act": "", "src": "교육청 예시양식(교육청 예시양식)"}, {"t": 42.5, "label": "과업지시서 vs 제안요청서", "page": "75·90쪽", "act": "", "src": "교육청 예시양식 · 매뉴얼(실무 권장)"}, {"t": 65.85, "label": "Ⅰ. 사업 개요 + 작성 요령 1", "page": "75쪽", "act": "사업 개요 5항목 작성", "src": "교육청 예시양식"}, {"t": 89.0, "label": "입찰 참가자격", "page": "75쪽", "act": "", "src": "계약 관련 법령(법령) · 교육청 예시양식"}, {"t": 111.95, "label": "계약 내용 — 견적 산출 근거", "page": "76~79쪽", "act": "계약 내용 항목별 작성", "src": "교육청 예시양식"}, {"t": 132.9, "label": "보험 — 구조송환·자연재해", "page": "83쪽", "act": "", "src": "현장체험학습 길라잡이 p.20"}, {"t": 154.5, "label": "14. 운영인력 + 필수 체크항목", "page": "85쪽", "act": "", "src": "현장체험학습 길라잡이 p.4·6·7"}, {"t": 191.05, "label": "별지 제1·2호 확인서", "page": "88~89쪽", "act": "", "src": "교육청 예시양식"}, {"t": 207.45, "label": "제안서 평가 기준(정량 30 + 정성 70)", "page": "93쪽", "act": "", "src": "교육청 예시양식"}, {"t": 230.8, "label": "평가위원회·독소조항·제출서류", "page": "97쪽 → 99~113쪽", "act": "제출 서식 목록 확인", "src": "평가위원회 운영규칙 · 교육청 예시양식"}, {"t": 255.35, "label": "유의사항", "page": "", "act": "", "src": "계약 관련 법령 · 평가위원회 운영규칙"}, {"t": 275.75, "label": "7장 업무 완료 체크리스트", "page": "", "act": "체크리스트 확인", "src": ""}, {"t": 289.05, "label": "마무리 · 다음 단계", "page": "", "act": "", "src": ""}], "cues": [[0.8, 4.0, "7장 과업지시서와 제안요청서입니다."], [4.35, 11.95, "해외현장체험학습의 항공과 숙박, 현지 프로그램은 여행 용역으로 위탁하는 경우가 많습니다."], [12.3, 19.9, "이때 학교가 원하는 조건을 정확히 적은 서류가 있어야 좋은 업체를 공정하게 고를 수 있습니다."], [21.95, 27.15, "이 장은 교육청이 배포한 예시 양식의 전문을 그대로 실었습니다."], [27.5, 35.1, "원본 파일에 메모로 달려 있던 작성 요령은 번호를 붙여 해당 조항 바로 아래 상자로 옮겼습니다."], [35.45, 41.25, "출발과 도착 지점만 모든 학교가 쓸 수 있도록 본교로 바꾸어 적었습니다."], [43.3, 45.5, "두 서류의 역할은 다릅니다."], [45.85, 59.05, "과업지시서는 업체가 무엇을 해야 하는지 정한 과업 내용서이고, 제안요청서는 업체에게 어떤 제안서를 어떻게 내라고 요청하고 어떻게 평가할지 정한 문서입니다."], [59.4, 64.6, "둘 다 학교가 작성하고, 입찰 공고와 계약은 행정실이 진행합니다."], [66.65, 69.25, "사업 개요부터 채워 보겠습니다."], [69.6, 73.6, "사업명과 기간, 예정 인원, 장소, 사업비를 적습니다."], [73.95, 87.75, "작성 요령 1번처럼 입찰을 사업기간보다 3개월 이상 여유 있게 진행하면 업체가 항공권을 확보하기 쉽고, 학교가 직접 항공권 블록을 잡을 수는 없다는 점도 기억해 두세요."], [89.8, 93.4, "용역 조건에서는 입찰 참가 자격을 적습니다."], [93.75, 104.15, "지방계약법 시행령 제13조의 요건과 관광진흥법에 따른 여행업 등록을 갖추고, 부정당업자로 제한 중이 아닌 업체여야 합니다."], [104.5, 110.7, "작성 요령 2번처럼 특정 업체만 수행할 수 있는 과업 지시는 넣으면 안 됩니다."], [112.75, 119.75, "계약 내용에는 일정과 숙박, 식사, 차량, 수행 인력, 보험, 안전관리를 구체적으로 적습니다."], [120.1, 128.5, "경비 항목은 업체 견적의 산출 근거가 되므로 정확해야 하고, 비자가 필요 없는 나라도 있으니 확인합니다."], [128.85, 131.65, "사전답사는 실시할 때만 적습니다."], [133.7, 141.9, "여행자보험 조항에는 중대사고 구조송환비용과 자연재해로 인한 상해·사망 보장을 필수로 넣습니다."], [142.25, 153.25, "현장체험학습 길라잡이 20쪽은 국외 활동에 실비 전액 보상 조건 가입을 권장하고, 구조송환비용 특약 내용을 확인하도록 안내합니다."], [155.3, 165.5, "운영인력 조항에는 수행안내원이 본교 출발부터 도착까지 동행하고, 같은 숙박시설에 머물며 야간에도 대처하도록 적습니다."], [165.85, 181.05, "수행안내원을 외부 안전요원으로 인정받으려면 국외여행인솔자 자격증과 안전과정 14시간 이수증 제출을 명시하고, 성범죄·아동학대 전력은 학교장이 관할 경찰서에 직접 조회합니다."], [181.4, 189.8, "근무시간은 하루 최장 8시간으로 적고, 현지에서 합류하는 가이드는 안전요원으로 인정되지 않습니다."], [191.85, 201.45, "용역이 끝나면 88쪽과 89쪽의 별지 제1호 용역 준비 확인서와 별지 제2호 용역 완료 확인서로 이행을 확인합니다."], [201.8, 206.2, "제출자는 업체 대표, 확인자는 사업부서 담당자입니다."], [208.25, 210.25, "이제 제안요청서입니다."], [210.6, 220.0, "93쪽의 평가 기준을 보면 정량평가 30점은 담당부서가 심사하고, 정성평가 70점은 평가위원회가 평가합니다."], [220.35, 229.55, "방문기관 운영계획과 운영 제반 사항, 안전 및 건강관리 방안처럼 우리 학교에 중요한 항목에 배점이 실려 있습니다."], [231.6, 239.6, "평가위원회는 위원장을 포함해 7인 이상 10인 이내로 구성하고, 6인으로는 성립하지 않습니다."], [239.95, 244.35, "이의를 제기할 수 없다 같은 독소조항은 넣지 않습니다."], [244.7, 254.1, "제출 서류는 97쪽 목록처럼 제안서 표지부터 개인정보 관련 서식까지이며, 서식 원본은 99쪽부터 실려 있습니다."], [256.15, 260.35, "계약과 관련된 내용은 학교 혼자 결정하지 않습니다."], [260.7, 274.5, "과업지시서와 제안요청서는 담당 교사가 작성하지만, 입찰 방식과 자격 요건, 평가위원회 구성은 관련 법령과 교육지원청·학교 계약 담당 부서의 검토를 거쳐 확정해 주세요."], [276.55, 278.55, "7장 체크리스트입니다."], [278.9, 286.3, "서류 초안을 행정실에 넘겼다면, 마지막 부록 영상에서 실제 서식을 찾아 작성해 보겠습니다."], [289.85, 296.25, "행정절차와 제출서류는 업무의 성격이나 지침 개정에 따라 달라질 수 있습니다."], [296.6, 302.6, "실제 추진 전에는 해당 연도 교육청 지침과 관련 법령을 다시 확인해 주세요."]], "check": ["사업 개요(기간·인원·장소·사업비)를 작성했다", "입찰 참가자격과 특정 업체 제한 조항 여부를 점검했다", "보험·운영인력·안전 조항을 4장 기준으로 채웠다", "평가 기준과 제출 서식 목록을 행정실과 확인했다"], "file": "videos/07.mp4", "vtt": "subs/07.vtt"}, {"id": "appendix", "key": "APPX", "no": "APPENDIX", "title": "부록 및 서식", "sub": "필요한 서식을 찾아 작성하기", "goal": "업무 단계별로 필요한 부록 서식을 찾아 작성 주체·시점·필수 사항에 맞게 작성할 수 있다.", "why": "본문에서 설명한 업무가 실제로는 서식 작성으로 끝나기 때문에, 부록 서식을 업무 단계와 연결해 직접 찾아 쓰는 실습 영상으로 따로 구성했습니다.", "pages": "114~142쪽", "practice": "공무국외출장 서식 세트 준비, 학생 동의서 배부·수합, 일일 상황 보고 작성", "dur": 200.5, "srcs": [{"t": "전북특별자치도교육감 소속 공무원의 공무국외출장 규정", "o": "전북특별자치도교육청 (교육훈령 제308호)", "d": "2026. 5. 1. 시행", "k": "행정규칙(훈령)", "c": "law", "n": "허가권자(제3조제1항), 심사 대상(제5조), 별표 제1호 심사 기준, 별지 제1~6호 서식"}, {"t": "학생 해외연수 안전 길라잡이", "o": "전북특별자치도교육청 정책기획과", "d": "2026. 4.", "k": "교육청 안내자료", "c": "gov", "n": "해외연수 안전요원 배치 기준, 사안 보고 체계, 단계별 체크리스트"}, {"t": "국제교류수업 운영 매뉴얼(본 매뉴얼)", "o": "전북특별자치도교육청", "d": "2026", "k": "매뉴얼 자체(실무 권장)", "c": "case", "n": "법적 구속력 없는 교사용 업무 참고서"}], "scenes": [{"t": 0, "label": "이 장을 따로 구성한 이유", "page": "114쪽", "act": "", "src": ""}, {"t": 22.1, "label": "부록 서식 지도", "page": "115~142쪽", "act": "", "src": "공무국외출장 규정 · 해외연수 안전 길라잡이 · 매뉴얼(실무 권장)"}, {"t": 36.05, "label": "별지 제1호 — 심사 및 허가 요청서", "page": "115쪽", "act": "", "src": "공무국외출장 규정 별지 제1호"}, {"t": 60.0, "label": "Ⅰ-1 심사 및 허가 요청서 — 칸별 작성", "page": "115~117쪽", "act": "요청서·기준 확인사항·계획서 작성", "src": "공무국외출장 규정"}, {"t": 86.75, "label": "학생 참가 서식(Ⅱ-1~4)", "page": "122~125쪽", "act": "동의서 배부·수합 명단 관리", "src": "매뉴얼(실무 권장)"}, {"t": 10 const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CATN = { law: '법령·규정', gov: '교육청 지침·안내', case: '사례·실무 권장' };
let cur = 0, tab = 'script', pendingSeek = null;

NOTICE.forEach(t => { const p = document.createElement('p'); p.textContent = t; $('#notice').appendChild(p); });

function frac(i) { return Math.min(1, (st.max[D[i].id] || 0) / D[i].dur); }
function renderSide() {
  $('#chs').innerHTML = D.map((c, i) => `
    <button class="ch${frac(i) >= .9 ? ' is-done' : ''}" data-i="${i}" aria-current="${i === cur}">
      <span class="n">${c.no === 'INTRO' ? 'IN' : c.no === 'APPENDIX' ? '부록' : c.no}</span>
      <span><span class="t">${esc(c.title)}</span><span class="m">${mmss(c.dur)} · ${c.scenes.length}장면</span><span class="p"><i style="width:${frac(i) * 100}%"></i></span></span>
      <span class="done" aria-label="시청 완료">✓</span>
    </button>${i === cur ? '<ul class="sc" id="scl">' + c.scenes.map((s, j) => `<li><button data-t="${s.t}" data-j="${j}"><time>${mmss(s.t)}</time><span>${esc(s.label)}</span></button></li>`).join('') + '</ul>' : ''}`).join('');
  const n = D.filter((c, i) => frac(i) >= .9).length;
  $('#ovt').textContent = `${n} / ${D.length} 완료`; $('#ovb').style.width = (n / D.length * 100) + '%';
}
$('#chs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.i !== undefined) go(+b.dataset.i, true); else { v.currentTime = +b.dataset.t; v.play().catch(() => {}); }
});

function sceneAt(t) { const s = D[cur].scenes; let j = 0; for (let k = 0; k < s.length; k++) if (s[k].t <= t + .05) j = k; return j; }

function load(i, autoplay, seek) {
  cur = i; const c = D[i];
  if (location.hash !== '#' + c.id) history.replaceState(null, '', '#' + c.id);
  v.innerHTML = '';
  v.src = c.file;
  const tr = document.createElement('track'); tr.kind = 'subtitles'; tr.srclang = 'ko'; tr.label = '한국어'; tr.src = vttURL(c); tr.default = true; v.appendChild(tr);
  v.playbackRate = +$('#rate').value;
  $('#eb').textContent = c.no === 'INTRO' ? 'INTRO' : c.no === 'APPENDIX' ? 'APPENDIX' : 'CHAPTER ' + c.no;
  $('#tt').innerHTML = esc(c.title) + (c.sub ? `<small>${esc(c.sub)}</small>` : '');
  $('#why').innerHTML = `<b>이 장을 따로 구성한 이유</b> · ${esc(c.why)}`;
  $('#info').innerHTML = `<div><b>교육 목표</b>${esc(c.goal)}</div><div><b>매뉴얼 쪽</b>${esc(c.pages)}</div><div><b>따라 할 실습</b>${esc(c.practice)}</div>`;
  $('#prev').disabled = i === 0; $('#next').disabled = i === D.length - 1;
  $('#next').textContent = i === D.length - 1 ? '마지막 영상' : '다음 ▶';
  const p = st.pos[c.id] || 0;
  pendingSeek = seek ?? null;
  const rb = $('#resume');
  if (seek == null && p > 10 && p < c.dur - 15) { rb.hidden = false; rb.textContent = `▶ ${mmss(p)}부터 이어보기`; rb.onclick = () => { v.currentTime = p; v.play().catch(() => {}); rb.hidden = true; }; }
  else rb.hidden = true;
  renderSide(); renderPane(); updNow(0);
  if (autoplay) v.play().catch(() => {});
  document.title = c.title + ' · 국제교류 실무 영상 강의실';
}
const vttCache = {};
function vttURL(c) {
  if (vttCache[c.id]) return vttCache[c.id];
  const f = s => { const ms = Math.round(s * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, x = Math.floor(ms / 1000) % 60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}.${String(ms % 1000).padStart(3,'0')}`; };
  const txt = 'WEBVTT\n\n' + c.cues.map((q, n) => `${n + 1}\n${f(q[0])} --> ${f(q[1])}\n${q[2]}\n`).join('\n');
  return vttCache[c.id] = URL.createObjectURL(new Blob([txt], { type: 'text/vtt' }));
}
function go(i, autoplay, seek) { if (i < 0 || i >= D.length) return; load(i, autoplay, seek); window.scrollTo({ top: 0, behavior: 'smooth' }); }
v.addEventListener('loadedmetadata', () => {
  if (pendingSeek != null) { v.currentTime = pendingSeek; pendingSeek = null; v.play().catch(() => {}); }
  setCC();
});
function setCC() { for (const t of v.textTracks) t.mode = $('#cc').checked ? 'showing' : 'hidden'; }
$('#cc').addEventListener('change', setCC);
$('#rate').addEventListener('change', () => v.playbackRate = +$('#rate').value);
$('#prev').onclick = () => go(cur - 1, true);
$('#next').onclick = () => go(cur + 1, true);

let lastScene = -1, lastSave = 0;
function updNow(t) {
  const c = D[cur], j = sceneAt(t);
  if (j === lastScene) return; lastScene = j;
  const s = c.scenes[j];
  $('#now').innerHTML = `<span><b>장면 ${j + 1}/${c.scenes.length}</b>${esc(s.label)}</span>` + (s.act ? `<span><b>지금 할 일</b>${esc(s.act)}</span>` : '') + (s.page ? `<span><b>매뉴얼</b>${esc(s.page)}</span>` : '') + (s.src && s.src !== '—' ? `<span><b>근거</b>${esc(s.src)}</span>` : '');
  document.querySelectorAll('#scl button').forEach((b, k) => b.classList.toggle('on', k === j));
}
v.addEventListener('timeupdate', () => {
  const c = D[cur], t = v.currentTime;
  updNow(t);
  if (tab === 'script') {
    let k = -1; c.cues.forEach((q, n) => { if (q[0] <= t + .1) k = n; });
    const els = document.querySelectorAll('#pane .cue');
    els.forEach((el, n) => el.classList.toggle('on', n === k));
    if (k >= 0 && els[k] && !v.paused) { const pane = $('#pane'), el = els[k]; if (el.offsetTop < pane.scrollTop || el.offsetTop > pane.scrollTop + pane.clientHeight - 60) pane.scrollTop = el.offsetTop - 80; }
  }
  if (t > (st.max[c.id] || 0)) st.max[c.id] = t;
  st.pos[c.id] = t;
  if (Date.now() - lastSave > 3000) { lastSave = Date.now(); save(); const before = $('#chs .ch[aria-current="true"] .p i'); if (before) before.style.width = frac(cur) * 100 + '%'; }
});
v.addEventListener('pause', save);
v.addEventListener('ended', () => {
  st.max[D[cur].id] = D[cur].dur; st.pos[D[cur].id] = 0; save(); renderSide();
  if ($('#auto').checked && cur < D.length - 1) { toast(`다음 챕터 「${D[cur + 1].title}」를 재생합니다`); setTimeout(() => go(cur + 1, true), 1800); }
});

function renderPane() {
  const c = D[cur], P = $('#pane');
  document.querySelectorAll('.tablist button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === tab));
  if (tab === 'script') {
    let h = '', si = 0;
    c.cues.forEach((q, n) => {
      while (si < c.scenes.length && c.scenes[si].t <= q[0]) { h += `<div class="sh">장면 ${si + 1} · ${esc(c.scenes[si].label)}</div>`; si++; }
      h += `<div class="cue" data-t="${q[0]}"><time>${mmss(q[0])}</time><span>${esc(q[2])}</span></div>`;
    });
    P.innerHTML = h;
  } else if (tab === 'scenes') {
    P.innerHTML = c.scenes.map((s, j) => `<div class="cue" data-t="${s.t}"><time>${mmss(s.t)}</time><span><b>${j + 1}. ${esc(s.label)}</b>${s.page ? ` <small style="color:var(--mute)">· 매뉴얼 ${esc(s.page)}</small>` : ''}${s.act ? `<br><small style="color:var(--teal)">지금 할 일: ${esc(s.act)}</small>` : ''}</span></div>`).join('');
  } else if (tab === 'check') {
    const ck = st.ck[c.id] || [];
    const done = c.check.filter((_, k) => ck[k]).length;
    P.innerHTML = `<div class="chk"><div class="sum"><span>영상을 보면서 실제로 끝낸 업무를 표시하세요. 이 브라우저에만 저장됩니다.</span><b>${done} / ${c.check.length}</b></div>` +
      c.check.map((x, k) => `<label><input type="checkbox" id="ck-${c.id}-${k}" data-k="${k}" ${ck[k] ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('') + '</div>';
  } else {
    P.innerHTML = `<div class="legend">배지 색은 근거의 성격입니다. <span class="bd law">법령·규정</span>지켜야 하는 기준 <span class="bd gov">교육청 지침·안내</span>해당 연도 확인 <span class="bd case">사례·실무 권장</span>참고 사항</div><div class="src">` +
      c.srcs.map(s => `<div><span class="bd ${s.c}">${CATN[s.c]}</span><b>「${esc(s.t)}」</b><small>${esc(s.o)} · ${esc(s.d)} · ${esc(s.k)}</small><br><small>${esc(s.n)}</small></div>`).join('') + '</div>';
  }
}
$('#pane').addEventListener('click', e => { const q = e.target.closest('.cue'); if (q) { v.currentTime = +q.dataset.t; v.play().catch(() => {}); } });
$('#pane').addEventListener('change', e => {
  const k = e.target.dataset.k; if (k === undefined) return;
  const id = D[cur].id; st.ck[id] = st.ck[id] || []; st.ck[id][k] = e.target.checked; save(); renderPane();
});
document.querySelector('.tablist').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.p; renderPane(); } });

// 검색
const q = $('#q'), res = $('#res');
q.addEventListener('input', () => {
  const w = q.value.trim(); if (w.length < 2) { res.hidden = true; return; }
  const out = [];
  D.forEach((c, i) => c.cues.forEach(cu => { if (cu[2].includes(w)) out.push([i, cu]); }));
  res.hidden = false;
  res.innerHTML = out.length ? out.slice(0, 40).map(([i, cu]) => `<button data-i="${i}" data-t="${cu[0]}"><small>${esc(D[i].no === 'INTRO' ? 'INTRO' : D[i].no === 'APPENDIX' ? '부록' : D[i].no + '장')} ${esc(D[i].title)} · ${mmss(cu[0])}</small>${esc(cu[2]).split(esc(w)).join('<mark>' + esc(w) + '</mark>')}</button>`).join('')
    : `<div class="none">「${esc(w)}」가 들어간 대본이 없습니다. 다른 낱말로 찾아보세요.</div>`;
});
res.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; res.hidden = true; q.value = ''; const i = +b.dataset.i, t = +b.dataset.t; if (i === cur) { v.currentTime = t; v.play().catch(() => {}); } else go(i, true, t); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });

// 단축키
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const s = D[cur].scenes, j = sceneAt(v.currentTime);
  if (e.key === 'ArrowRight' && e.target !== v) { v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 5); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' && e.target !== v) { v.currentTime = Math.max(0, v.currentTime - 5); e.preventDefault(); }
  else if (e.key === ']') { if (j < s.length - 1) v.currentTime = s[j + 1].t; }
  else if (e.key === '[') { v.currentTime = (v.currentTime - s[j].t > 2 || j === 0) ? s[j].t : s[j - 1].t; }
  else if (e.key === 'k' || e.key === 'K') { v.paused ? v.play().catch(() => {}) : v.pause(); }
  else if (e.key === 'n' || e.key === 'N') go(cur + 1, true);
});

function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2600); }
function fromHash() { const i = D.findIndex(c => '#' + c.id === location.hash); return i < 0 ? 0 : i; }
window.addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) load(i, false); });
load(fromHash(), false);
</script>

</body>
</html>

<!-- 자막 크기: 플레이어 폭에 비례 + 작게/보통/크게 선택 (세로 휴대폰 대응) -->
<style>
video::cue{font-size:clamp(11px,2.1vw,22px)!important;line-height:1.4;background:rgba(23,48,94,.85)}
video.cc-s::cue{font-size:clamp(9px,1.6vw,17px)!important}
video.cc-l::cue{font-size:clamp(13px,2.8vw,28px)!important}
@media (max-width:900px){video::cue{font-size:clamp(11px,3.1vw,20px)!important}video.cc-s::cue{font-size:clamp(9px,2.5vw,16px)!important}video.cc-l::cue{font-size:clamp(13px,3.9vw,26px)!important}}
</style>
<script>
(function(){
  var v=document.getElementById('v'), cc=document.getElementById('cc'); if(!v||!cc) return;
  var lab=document.createElement('label');
  lab.innerHTML='자막 크기 <select id="ccs"><option value="cc-s">작게</option><option value="" selected>보통</option><option value="cc-l">크게</option></select>';
  cc.closest('label').after(lab);
  var s=lab.querySelector('select');
  try{var z=localStorage.getItem('iem-ccs'); if(z!==null) s.value=z;}catch(e){}
  function apply(){ v.classList.remove('cc-s','cc-l'); if(s.value) v.classList.add(s.value); try{localStorage.setItem('iem-ccs',s.value);}catch(e){} }
  s.addEventListener('change',apply); apply();
})();
</script>
